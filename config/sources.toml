# Fuentes de datos del proyecto. Las rutas son relativas a la raíz del repositorio.

[zenodo]
# Versión fijada (v1.1) para que la ingesta sea reproducible; no se usa "latest".
record_id = "21652187"
api_url = "https://zenodo.org/api/records"
dest_dir = "data/raw/zenodo"
files = [
    "curtailment_daily.parquet",
    "curtailment_hourly.parquet",
    "plants.parquet",
    "plants_metadata.parquet",
]

[open_meteo]
# Pronósticos archivados (no reanálisis): son lo que se conoce antes del día objetivo.
api_url = "https://historical-forecast-api.open-meteo.com/v1/forecast"
model = "ecmwf_ifs"
dest_dir = "data/raw/open_meteo/historical_forecast"
plants_metadata = "data/raw/zenodo/plants_metadata.parquet"
plants = "data/raw/zenodo/plants.parquet"
technologies = ["Solar", "Eólica"]
# Centrales a menos de ~0.1° (resolución de IFS, ~9 km) comparten consulta.
grid_resolution_deg = 0.1
# Fechas en UTC. El fin cubre hasta las 24:00 hora de Chile del 2026-05-31.
start_date = "2022-01-01"
end_date = "2026-06-01"
hourly = [
    "shortwave_radiation",
    "direct_normal_irradiance",
    "diffuse_radiation",
    "cloud_cover",
    "temperature_2m",
    "wind_speed_100m",
    "wind_direction_100m",
    "wind_gusts_10m",
]
wind_speed_unit = "ms"
# Límites del plan gratuito: 600/min, 5.000/hora, 10.000/día (llamadas ponderadas).
hourly_budget = 4500
run_budget = 9000
